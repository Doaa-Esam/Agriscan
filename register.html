<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1F33">
    <title>AgriScan - إنشاء حساب</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/all.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="screen register-screen">
        <div class="login-container">

            <!-- Logo -->
            <div class="app-logo">
                <div class="small-logo-icon">
                    <i class="fa-solid fa-seedling"></i>
                </div>
                <h1>AgriScan</h1>
            </div>

            <!-- Title -->
            <h2>إنشاء حساب</h2>
            <p class="subtitle">ابدأ في متابعة حالة تربتك</p>

            <!-- Register Form -->
            <form id="registerForm">

                <!-- Full Name -->
                <div class="input-group">
                    <label for="registerName"> الاسم الكامل </label>
                    <input type="text" id="registerName" placeholder="أدخل اسمك" required>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label for="registerEmail"> البريد الإلكتروني </label>
                    <input type="email" id="registerEmail" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="registerPassword"> كلمة المرور </label>
                    <input type="password" id="registerPassword" placeholder="أنشئ كلمة مرور" required>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label for="confirmPassword"> تأكيد كلمة المرور </label>
                    <input type="password" id="confirmPassword" placeholder="أكد كلمة المرور" required>
                </div>

                <!-- Register Button -->
                <button type="submit" class="primary-btn">
                    <i class="fa-solid fa-user-plus"></i>
                    إنشاء حساب
                </button>
            </form>

            <!-- Login -->
            <p class="register-text">
                لديك حساب بالفعل؟
                <button id="showLogin" class="link-btn" type="button">تسجيل الدخول</button>
            </p>
        </div>
    </section>
    
    <!-- JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
