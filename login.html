<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1F33">
    <title>AgriScan - تسجيل الدخول</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/all.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="screen login-screen">
        <div class="login-container">

            <!-- Logo -->
            <div class="app-logo">
                <div class="small-logo-icon">
                    <i class="fa-solid fa-seedling"></i>
                </div>
                <h1>AgriScan</h1>
            </div>
            <!-- Title -->
            <h2>مرحباً بعودتك</h2>
            <p class="subtitle">سجل الدخول لمتابعة حالة تربتك</p>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="input-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required>
                </div>

                <!-- Login Button -->
                <button type="submit" class="primary-btn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    تسجيل الدخول
                </button>
            </form>

            <!-- Register -->
            <p class="register-text">ليس لديك حساب؟
                <button id="showRegister" class="link-btn" type="button"> إنشاء حساب </button>
            </p>
        </div>
    </section>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
