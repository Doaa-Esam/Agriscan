<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#0B1F33">

    <title>AgriScan - تفاصيل المحصول</title>

    <link
        rel="stylesheet"
        href="css/all.css">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>

    <section class="screen crop-details-screen">

        <div class="crop-details-container">


            <!-- BACK -->

            <button
                class="back-btn"
                id="backToCrops"
                type="button">

                <i class="fa-solid fa-arrow-right"></i>

            </button>


            <!-- HEADER -->

            <div class="crop-header">

                <div class="crop-header-icon">

                    <i class="fa-solid fa-seedling"></i>

                </div>

                <h1 id="cropName">
                    جاري تحميل المحصول...
                </h1>

                <p>
                    تفاصيل المحصول والتشخيصات المرتبطة به
                </p>

            </div>


            <!-- CROP DESCRIPTION -->

            <div class="crop-advice">

                <div class="advice-icon">

                    <i class="fa-solid fa-leaf"></i>

                </div>

                <div>

                    <h2>
                        عن المحصول
                    </h2>

                    <p id="cropDescription">
                        جاري تحميل بيانات المحصول...
                    </p>

                </div>

            </div>


            <!-- CROP IMAGES -->

            <div class="crop-section">

                <div class="section-heading">

                    <div>

                        <span class="section-label">
                            صور المحصول
                        </span>

                        <h2>
                            صور المحصول
                        </h2>

                    </div>

                    <i class="fa-solid fa-image"></i>

                </div>


                <div
                    class="crop-images"
                    id="cropImages">

                    <p>
                        جاري تحميل الصور...
                    </p>

                </div>

            </div>


            <!-- DISEASES -->

            <div class="crop-section">

                <div class="section-heading">

                    <div>

                        <span class="section-label">
                            الأمراض
                        </span>

                        <h2>
                            الأمراض المرتبطة بالمحصول
                        </h2>

                    </div>

                    <i class="fa-solid fa-triangle-exclamation"></i>

                </div>


                <div
                    id="diseasesContainer">

                    <p>
                        جاري تحميل الأمراض...
                    </p>

                </div>

            </div>


            <!-- NEW SCAN -->

            <button
                class="new-scan-btn"
                id="newScanBtn"
                type="button">

                <i class="fa-solid fa-magnifying-glass"></i>

                فحص تربة جديد

            </button>


        </div>

    </section>


    <script src="js/app.js"></script>

    <script src="js/crop-details-view.js"></script>

</body>

</html>
