<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1F33">

    <title>AgriScan - المزارع</title>

    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ================================
           FARMS PAGE
        ================================= */

        .farms-screen {
            min-height: 100vh;
        }

        .farms-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 25px 20px 40px;
            box-sizing: border-box;
        }

        /* HEADER */

        .farms-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .farms-header-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: #e8f7d8;
            color: #63a925;
            font-size: 32px;
        }

        .farms-header h1 {
            margin: 0 0 6px;
            font-size: 30px;
        }

        .farms-header p {
            margin: 0;
            color: #777;
            font-size: 15px;
        }

        /* SUMMARY */

        .farms-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .farm-summary-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .farm-summary-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #e8f7d8;
            color: #63a925;
            font-size: 20px;
        }

        .farm-summary-card strong {
            display: block;
            font-size: 24px;
            line-height: 1.2;
        }

        .farm-summary-card span {
            display: block;
            margin-top: 3px;
            color: #777;
            font-size: 13px;
        }

        /* SECTION */

        .farms-section {
            margin-bottom: 22px;
        }

        .farms-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .farms-section-title span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .farms-section-title h2 {
            margin: 0;
            font-size: 22px;
        }

        .farms-section-title > i {
            color: #63a925;
            font-size: 25px;
        }

        /* FARM CARDS */

        .farm-card {
            background: #fff;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .farm-card-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .farm-icon {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #e8f7d8;
            color: #63a925;
            font-size: 22px;
        }

        .farm-title {
            flex: 1;
        }

        .farm-title h3 {
            margin: 0 0 5px;
            font-size: 18px;
        }

        .farm-title span {
            color: #777;
            font-size: 13px;
        }

        .farm-menu-btn {
            border: none;
            background: transparent;
            color: #777;
            cursor: pointer;
            font-size: 20px;
        }

        .farm-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 18px 0;
        }

        .farm-details > div {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 5px;
            background: #f7f9f5;
            border-radius: 10px;
            font-size: 12px;
        }

        .farm-details i {
            color: #63a925;
        }

        .farm-view-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #edf7e6;
            color: #4d8c1d;
            font-weight: bold;
            cursor: pointer;
        }

        /* EMPTY STATE */

        #farmsContainer > p {
            text-align: center;
            padding: 25px 15px;
            color: #777;
            line-height: 1.8;
        }

        /* ADD FARM FORM */

        #addFarmForm {
            margin-top: 20px;
        }

        #addFarmForm .farms-section {
            background: #ffffff;
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        }

        #farmForm {
            width: 100%;
        }

        #farmForm > div {
            width: 100%;
            margin-bottom: 16px;
        }

        #farmForm label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        #farmForm input,
        #farmForm select {
            display: block;
            width: 100%;
            height: 48px;
            box-sizing: border-box;
            padding: 0 14px;
            border: 1px solid #d9ded5;
            border-radius: 12px;
            background: #fff;
            color: #333;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        #farmForm input:focus,
        #farmForm select:focus {
            border-color: #63a925;
            box-shadow: 0 0 0 3px rgba(99, 169, 37, 0.12);
        }

        #farmForm select {
            cursor: pointer;
        }

        /* FORM BUTTONS */

        #farmForm .add-farm-btn {
            width: 100%;
            min-height: 50px;
            margin: 0 0 12px;
            padding: 12px 16px;
            border: none;
            border-radius: 13px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #farmForm .add-farm-btn:last-child {
            margin-bottom: 0;
        }

        #farmForm .add-farm-btn:first-of-type {
            background: #69b52b;
            color: #fff;
        }

        #farmForm .add-farm-btn:last-of-type {
            background: #eeeeee;
            color: #555;
        }

        /* MAIN ADD BUTTON */

        #addFarmBtn {
            width: 100%;
            min-height: 52px;
            margin-top: 10px;
            padding: 13px 18px;
            border: none;
            border-radius: 14px;
            background: #69b52b;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* BACK BUTTON */

        #backToDashboardFromFarms {
            margin-bottom: 15px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .farms-container {
                padding: 20px 14px 35px;
            }

            .farms-summary {
                gap: 10px;
            }

            .farm-summary-card {
                padding: 14px 10px;
            }

            .farm-summary-icon {
                width: 42px;
                height: 42px;
            }

            .farm-details {
                grid-template-columns: 1fr;
            }

            #addFarmForm .farms-section {
                padding: 18px 15px;
            }
        }
    </style>
</head>

<body>

    <section class="screen farms-screen">

        <div class="farms-container">

            <!-- BACK -->

            <button
                class="back-btn"
                id="backToDashboardFromFarms"
                type="button">

                <i class="fa-solid fa-arrow-left"></i>

            </button>


            <!-- HEADER -->

            <div class="farms-header">

                <div class="farms-header-icon">
                    <i class="fa-solid fa-wheat-awn"></i>
                </div>

                <h1>مزارعي</h1>

                <p>إدارة مزارعك وحقولك</p>

            </div>


            <!-- SUMMARY -->

            <div class="farms-summary">

                <div class="farm-summary-card">

                    <div class="farm-summary-icon">
                        <i class="fa-solid fa-house"></i>
                    </div>

                    <div>
                        <strong id="farmsCount">0</strong>
                        <span>المزارع</span>
                    </div>

                </div>


                <div class="farm-summary-card">

                    <div class="farm-summary-icon">
                        <i class="fa-solid fa-ruler-combined"></i>
                    </div>

                    <div>
                        <strong id="totalArea">0</strong>
                        <span>إجمالي الأفدنة</span>
                    </div>

                </div>

            </div>


            <!-- FARMS -->

            <div class="farms-section">

                <div class="farms-section-title">

                    <div>
                        <span>مواقعي</span>
                        <h2>مزارعك</h2>
                    </div>

                    <i class="fa-solid fa-location-dot"></i>

                </div>


                <div id="farmsContainer">

                    <p>جاري تحميل المزارع...</p>

                </div>

            </div>


            <!-- ADD FARM FORM -->

            <div
                id="addFarmForm"
                style="display: none;">

                <div class="farms-section">

                    <div class="farms-section-title">

                        <div>
                            <span>مزرعة جديدة</span>
                            <h2>إضافة مزرعة</h2>
                        </div>

                        <i class="fa-solid fa-plus"></i>

                    </div>


                    <form id="farmForm">

                        <div>

                            <label for="farmName">
                                اسم المزرعة
                            </label>

                            <input
                                type="text"
                                id="farmName"
                                placeholder="مثال: مزرعة العائلة"
                                required>

                        </div>


                        <div>

                            <label for="farmLocation">
                                الموقع
                            </label>

                            <input
                                type="text"
                                id="farmLocation"
                                placeholder="مثال: المنوفية"
                                required>

                        </div>


                        <div>

                            <label for="farmArea">
                                المساحة بالأفدنة
                            </label>

                            <input
                                type="number"
                                id="farmArea"
                                min="0"
                                step="0.1"
                                placeholder="مثال: 5"
                                required>

                        </div>


                        <div>

                            <label for="farmCrop">
                                المحصول
                            </label>

                            <select
                                id="farmCrop"
                                required>

                                <option value="">
                                    جاري تحميل المحاصيل...
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="add-farm-btn">

                            <i class="fa-solid fa-check"></i>

                            حفظ المزرعة

                        </button>


                        <button
                            type="button"
                            id="cancelFarmBtn"
                            class="add-farm-btn">

                            <i class="fa-solid fa-xmark"></i>

                            إلغاء

                        </button>

                    </form>

                </div>

            </div>


            <!-- ADD FARM -->

            <button
                class="add-farm-btn"
                id="addFarmBtn"
                type="button">

                <i class="fa-solid fa-plus"></i>

                إضافة مزرعة جديدة

            </button>

        </div>

    </section>


    <script src="js/app.js"></script>
    <script src="js/farms.js"></script>

</body>

</html>
