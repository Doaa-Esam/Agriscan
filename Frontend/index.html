<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1F33">
    <title>AgriScan</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/all.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Splash Screen -->

    <section class="screen splash-screen">
        <div class="splash-content">

            <div class="logo-icon">
                <i class="fa-solid fa-seedling"></i>
            </div>

            <h1>AgriScan</h1>

            <p>التشخيص الذكي للتربة</p>

            <div class="loading"></div>

        </div>
    </section>


    <script>

        const API_URL = "https://accelerator-standard-giraffe.abasthan.app/api";


        setTimeout(async function () {

            const token =
                localStorage.getItem("agriscan_token");


            // NO TOKEN
            if (!token) {

                window.location.href = "login.html";

                return;

            }


            // VERIFY TOKEN
            try {

                const response =
                    await fetch(`${API_URL}/auth/me`, {

                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }

                    });


                // VALID TOKEN
                if (response.ok) {

                    window.location.href =
                        "dashboard.html";

                    return;

                }


                // INVALID / EXPIRED TOKEN
                localStorage.removeItem(
                    "agriscan_token"
                );

                localStorage.removeItem(
                    "agriscan_user"
                );

                window.location.href =
                    "login.html";


            } catch (error) {

                console.error(
                    "خطأ في التحقق من تسجيل الدخول:",
                    error
                );

                window.location.href =
                    "login.html";

            }

        }, 5000);

    </script>

</body>

</html>
