<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1F33">
    <title>AgriScan - سجل الفحوصات</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/all.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section class="screen history-screen">

        <!-- history-container -->
        <div class="history-container">
            <button class="back-btn" id="backToDashboard" type="button"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="history-header">
                <div class="history-header-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <h1>سجل الفحوصات</h1>
                <p>عرض نتائج تحاليل التربة السابقة</p>
            </div>

            <!-- history-summary -->
            <div class="history-summary">
                <div class="history-summary-item">
                    <i class="fa-solid fa-flask"></i>
                    <div><strong id="totalScans">0</strong><span>إجمالي الفحوصات</span></div>
                </div>
                <div class="history-summary-item">
                    <i class="fa-solid fa-seedling"></i>
                    <div><strong id="goodScans">0</strong><span>فحوصات جيدة</span></div>
                </div>
            </div>

            <!-- HISTORY CONTENT -->

            <div id="historyContent">
                <div class="history-empty-state">
                   <i class="fa-solid fa-spinner fa-spin"></i>

                   <p> جاري تحميل سجل الفحوصات... </p>

                </div>

            </div>

            <button class="new-history-scan-btn" id="historyNewScan" type="button"><i class="fa-solid fa-plus"></i> فحص جديد للتربة</button>
        </div>
    </section>

   <!-- JavaScript -->
    <script src="js/app.js"></script>
    <script src="js/scan-history.js"></script>
</body>
</html>
