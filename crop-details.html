<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#0B1F33">

    <title>AgriScan - توصيات المحاصيل</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="css/all.css">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>

    <section class="screen crop-details-screen">

        <div class="crop-details-container">


            <!-- BACK -->

            <button
                class="back-btn"
                id="backToAnalysis"
                type="button">

                <i class="fa-solid fa-arrow-left"></i>

            </button>


            <!-- HEADER -->

            <div class="crop-header">

                <div class="crop-header-icon">

                    <i class="fa-solid fa-seedling"></i>

                </div>

                <h1>
                    توصيات المحاصيل
                </h1>

                <p>
                    المحاصيل المسجلة في نظام AgriScan
                </p>

            </div>


            <!-- SOIL SUMMARY -->

            <div class="soil-summary">

                <div class="summary-icon">

                    <i class="fa-solid fa-flask"></i>

                </div>


                <div>

                    <span>
                        حالة التربة الخاصة بك
                    </span>


                    <strong id="soilStatus">
                        جاري التحميل...
                    </strong>


                    <p id="soilSummaryText">
                        جاري تحميل بيانات الفحص...
                    </p>

                </div>

            </div>


            <!-- CROPS -->

            <div class="crop-section">

                <div class="section-heading">

                    <div>

                        <span class="section-label">
                            المحاصيل
                        </span>

                        <h2>
                            المحاصيل المتاحة
                        </h2>

                    </div>


                    <i
                        class="fa-solid fa-wand-magic-sparkles">
                    </i>

                </div>


                <!-- Dynamic Crop Grid -->

                <div
                    class="crop-grid"
                    id="cropGrid">

                    <p>
                        جاري تحميل المحاصيل...
                    </p>

                </div>

            </div>


            <!-- ADVICE -->

            <div class="crop-advice">

                <div class="advice-icon">

                    <i class="fa-solid fa-lightbulb"></i>

                </div>


                <div>

                    <h2>
                        ملاحظة
                    </h2>

                    <p id="cropAdviceText">
                        جاري تحميل التوصيات...
                    </p>

                </div>

            </div>


            <!-- NEW SCAN -->

            <button
                class="new-scan-btn"
                id="newScanBtn"
                type="button">

                <i
                    class="fa-solid fa-magnifying-glass">
                </i>

                فحص تربة جديد

            </button>


        </div>

    </section>


    <!-- JavaScript -->

    <script src="js/app.js"></script>

    <script src="js/crop-details.js"></script>

</body>

</html>
