<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0B1F33"
    >

    <title>AgriScan - الملف الشخصي</title>

    <link
        rel="stylesheet"
        href="css/all.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <section class="screen settings-screen">

        <div class="settings-container">

            <button
                class="back-btn"
                id="backToSettings"
                type="button"
            >

                <i class="fa-solid fa-arrow-right"></i>

            </button>


            <div class="settings-header">

                <div class="settings-header-icon">

                    <i class="fa-solid fa-user"></i>

                </div>
                <h1> الملف الشخصي </h1>
                <p> بيانات حسابك في AgriScan </p>

            </div>


            <div class="settings-section" id="profileSection">

                <h2> بيانات الحساب </h2>


                <div class="settings-card">

                    <div class="settings-icon">

                        <i class="fa-solid fa-user"></i>

                    </div>


                    <div class="settings-info">

                        <strong> الاسم </strong>


                        <span id="profileName">
                            جاري تحميل البيانات...
                        </span>

                    </div>

                </div>


                <div class="settings-card">

                    <div class="settings-icon">

                        <i class="fa-solid fa-envelope"></i>

                    </div>


                    <div class="settings-info">

                        <strong> البريد الإلكتروني</strong>


                        <span id="profileEmail">
                            جاري تحميل البيانات...
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="js/profile.js"></script>

</body>

</html>
