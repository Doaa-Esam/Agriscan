<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0B1F33" >
    <title>AgriScan - اللغة</title>

    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css" >
</head>

<body>
    <section class="screen settings-screen">
        <div class="settings-container">
            <button class="back-btn" id="backToSettings" type="button" >
                <i class="fa-solid fa-arrow-right"></i>
            </button>


            <div class="settings-header">
                <div class="settings-header-icon">
                    <i class="fa-solid fa-language"></i>
                </div>

                <h1> اللغة </h1>
                <p> اختيار لغة التطبيق </p>
            </div>
            <div class="settings-section">
                <h2> لغة التطبيق </h2>
                <div class="settings-card">
                    <div class="settings-icon">
                        <i class="fa-solid fa-globe"></i>
                    </div>

                    <div class="settings-info">
                        <strong> العربية </strong>
                        <span> اللغة الحالية للتطبيق </span>
                    </div>

                    <span class="connected-status"> مفعلة </span>
                </div>

            </div>


            <div class="settings-section">
                <h2> اللغات المتاحة</h2>

                <div class="settings-card">

                    <div class="settings-icon">
                        <i class="fa-solid fa-check"></i>
                    </div>

                    <div class="settings-info">
                        <strong> العربية </strong>
                        <span> متاحة حاليًا </span>
                    </div>

                </div>

            </div>

        </div>

    </section>


    <script src="js/language.js"></script>

</body>

</html>
